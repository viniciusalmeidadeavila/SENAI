<!DOCTYPE html>

<head>

    <title>Tipos de Display e Navegação</title>
    <link rel="stylesheet" href="style.css">

<body>
    <section id="display-grid" class="bloco-conteudo">
        <h2>3. Display: Grid</h2>
        <p>O CSS Grid Layout é o sistema bidimensional. Ao contrário do Flexbox (unidimensional), o Grid permite organizar elementos em linhas e colunas simultaneamente, criando malhas complexas com extrema facilidade.</p>
            
        <div class="area-exemplo container-grid">
            <div class="caixa-grid">
                <img src="./image/1.jpg" alt="">
            </div>

            <div class="caixa-grid destaque-img">
                <img src="./image/2.jpg" alt="">
            </div>

            <div class="caixa-grid">
                <img src="./image/3.jpg" alt="">
            </div>

            <div class="caixa-grid">
                <img src="./image/4.jpg" alt="">
            </div>

            <div class="caixa-grid destaque-img2">
                <img src="./image/5.jpg" alt="">
            </div>

            <div class="caixa-grid">
                <img src="./image/6.jpg" alt="">
            </div>
            
        </div>
    </section>
</body>
</html>
